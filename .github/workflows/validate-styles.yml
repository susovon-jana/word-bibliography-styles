name: Validate bibliography styles

# Checks every .xsl in styles/ is a valid Word bibliography stylesheet.
# Runs on every push and pull request on any OS — no PowerShell needed.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate XSL files & refresh catalogue
        run: node scripts/generate-catalog.mjs
